<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Java 1</title>
</head>
<body>
    <label>Numri i pare</label>
    <input type="number" id="nr1">
    <br>
    <label>Numri i dyte</label>
    <input type="number" id="nr2">
    <br>
    <button type="submit" onclick="sum()">+</button>
    <p id="result"></p>
    <button type="submit" onclick="zbritje()">-</button>
    <button type="submit" onclick="shumezimi()">*</button>
    <button type="submit" onclick="pjestimi()">/</button>
    <p id="result1"></p>

    <script>
        function sum()
        {
            var a=Number(document.getElementById('nr1').value);
            var b=Number(document.getElementById('nr2').value);
            var c=a+b;
            document.getElementById('result').innerHTML=c;
        }
        function zbritje()
        {
            var a=Number(document.getElementById('nr1').value);
            var b=Number(document.getElementById('nr2').value);
            var c=a-b;
            document.getElementById('result1').innerHTML=c;
        }
           function shumezimi()
        {
            var a=Number(document.getElementById('nr1').value);
            var b=Number(document.getElementById('nr2').value);
            var c=a*b;
            document.getElementById('result1').innerHTML=c;
        }
           function pjestimi()
        {
            var a=Number(document.getElementById('nr1').value);
            var b=Number(document.getElementById('nr2').value);
            var c=a/b;
            document.getElementById('result1').innerHTML=c;
        }
    </script>
</body>
</html>
